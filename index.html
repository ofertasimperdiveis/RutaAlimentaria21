<!doctype html>
<html lang="es">

  <style>
    :root {
      color-scheme: light;
      --brand: #075e54;
      --brand-dark: #064b43;
      --chat-bg: #e9dfd2;
      --incoming: #ffffff;
      --outgoing: #dcf8c6;
      --option: #45aaa0;
      --checkout: #29a96b;
      --text: #151515;
      --muted: #7e827c;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      background: #cfc4b8;
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    button:disabled {
      cursor: not-allowed;
      opacity: .68;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
      background: var(--chat-bg);
    }

    .header {
      min-height: 80px;
      padding: max(10px, env(safe-area-inset-top)) 24px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: #fff;
      background: var(--brand);
    }

    .identity {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back {
      width: 28px;
      height: 42px;
      border: 0;
      color: #fff;
      background: transparent;
      font-size: 2.8rem;
      line-height: 1;
    }

    .avatar,
    .bot-avatar {
      border-radius: 50%;
      background:
        url("./assets/ruta-alimentaria-avatar.png") center / cover no-repeat,
        #f8f4e9;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55);
      flex: 0 0 auto;
    }

    .user-avatar {
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .avatar {
      width: 48px;
      height: 48px;
    }

    .user-avatar {
      background:
        radial-gradient(circle at 50% 36%, #eef1f3 0 18%, transparent 19%),
        radial-gradient(circle at 50% 77%, #eef1f3 0 30%, transparent 31%),
        #9aa1a6;
    }

    .title {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 1.45rem;
      line-height: 1.08;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified {
      width: 20px;
      height: 20px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #2ecc71;
      font-size: .86rem;
      line-height: 1;
    }

    .status {
      margin: 3px 0 0;
      color: rgba(255, 255, 255, .9);
      font-size: 1rem;
    }

    .progress-wrap {
      height: 3px;
      background: var(--brand);
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #8ee4d8;
      transition: width .22s ease;
    }

    .chat {
      min-height: 0;
      overflow-y: auto;
      padding: 28px 16px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png"),
        var(--chat-bg);
      background-size: 412px 749px;
      background-repeat: repeat;
    }

    .notice {
      width: min(100%, 660px);
      margin: 0 auto 38px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 24px;
      border-radius: 9px;
      color: #536b68;
      background: #d9f3ef;
      box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
    }

    .notice span {
      width: 28px;
      height: 28px;
      display: grid;
      flex: 0 0 28px;
      place-items: center;
      border-radius: 50%;
      color: #d9f3ef;
      background: #6f8581;
      font-size: 1rem;
      font-weight: 800;
    }

    .notice p {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.35;
    }

    .row {
      width: min(100%, 990px);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    .row.bot {
      align-items: flex-start;
      justify-content: flex-start;
    }

    .row.user { justify-content: flex-end; }

    .avatar-spacer,
    .user-avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
    }

    .bot-avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      margin-top: 1px;
      background-size: 138%;
      background-position: center 45%;
    }

    .avatar-spacer {
      width: 42px;
      flex-basis: 42px;
    }

    .avatar-spacer { opacity: 0; }

    .bubble {
      position: relative;
      max-width: min(76%, 310px);
      border-radius: 8px;
      padding: 14px 58px 18px 16px;
      font-size: 1.18rem;
      line-height: 1.36;
      letter-spacing: 0;
      box-shadow:
        0 1px 1.5px rgba(0, 0, 0, .16),
        0 1px 0 rgba(255, 255, 255, .42) inset;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      max-width: min(78%, 880px);
    }

    .user .bubble {
      max-width: min(42%, 360px);
    }

    .bot .bubble {
      background: var(--incoming);
      border-top-left-radius: 3px;
    }

    .user .bubble {
      background: var(--outgoing);
      color: #142019;
      border-top-right-radius: 3px;
    }

    .bot .bubble::before,
    .user .bubble::before {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
      content: "";
    }

    .bot .bubble::before {
      left: -9px;
      border-width: 0 10px 10px 0;
      border-color: transparent var(--incoming) transparent transparent;
    }

    .user .bubble::before {
      right: -9px;
      border-width: 0 0 10px 10px;
      border-color: transparent transparent transparent var(--outgoing);
    }

    .meta {
      position: absolute;
      right: 12px;
      bottom: 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: rgba(92, 99, 94, .72);
      font-size: .78rem;
      line-height: 1;
    }

    .checks {
      color: #34b7f1;
      font-size: .92rem;
    }

    .typing {
      width: 58px;
      height: 34px;
      margin-left: calc((100% - min(100%, 990px)) / 2);
      display: none;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      border-radius: 7px;
      background: var(--incoming);
      box-shadow: 0 1px 1px rgba(0, 0, 0, .12);
    }

    .typing.visible { display: flex; }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse .9s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .12s; }
    .typing span:nth-child(3) { animation-delay: .24s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: .35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    .options {
      width: min(100%, 520px);
      margin: 4px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding-left: 0;
      padding-top: 4px;
    }

    .options.single-options {
      width: min(100%, 990px);
      justify-content: flex-end;
      padding-right: 32px;
    }

    .option {
      min-width: min(100%, 134px);
      min-height: 46px;
      flex: 1 1 134px;
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      color: #fff;
      background: var(--option);
      box-shadow:
        0 1px 1.5px rgba(0, 0, 0, .18),
        0 1px 0 rgba(255, 255, 255, .16) inset;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
    }

    .option.single {
      flex: 0 1 330px;
      min-height: 86px;
      margin-left: auto;
      color: #142019;
      background: var(--outgoing);
      font-size: 1.14rem;
      font-weight: 500;
      text-align: left;
      padding-right: 54px;
      position: relative;
      animation: subtleReplyPulse 2.4s ease-in-out infinite;
    }

    .option.single::after {
      position: absolute;
      right: 13px;
      bottom: 8px;
      color: #34b7f1;
      font-size: .92rem;
      content: "✓✓";
    }

    @keyframes subtleReplyPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 1px 1.5px rgba(0, 0, 0, .18),
          0 1px 0 rgba(255, 255, 255, .16) inset;
      }

      50% {
        transform: scale(1.018);
        box-shadow:
          0 3px 8px rgba(0, 0, 0, .18),
          0 1px 0 rgba(255, 255, 255, .16) inset;
      }
    }

    .checkout-box {
      width: min(100%, 990px);
      margin: 8px auto 0;
      display: flex;
      justify-content: center;
      padding: 22px 0 0;
    }

    .checkout-link {
      width: min(100%, 340px);
      min-height: 66px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      background: var(--checkout);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .18);
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      animation: checkoutPulse 1.35s ease-in-out infinite;
    }

    .checkout-link:hover {
      background: #218d5a;
    }

    @keyframes checkoutPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 2px 4px rgba(0, 0, 0, .18), 0 0 0 0 rgba(41, 169, 107, .44);
      }

      50% {
        transform: scale(1.045);
        box-shadow: 0 8px 18px rgba(0, 0, 0, .2), 0 0 0 12px rgba(41, 169, 107, 0);
      }
    }

    .option:focus-visible,
    .back:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(142, 228, 216, .85);
      outline-offset: 2px;
    }

    .input-block {
      width: min(100%, 420px);
      align-self: center;
      margin-top: 4px;
      border-radius: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, .72);
    }

    .input-block label {
      display: block;
      margin-bottom: 6px;
      color: #345c58;
      font-size: .88rem;
      font-weight: 700;
    }

    .input-block input {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(69, 170, 160, .38);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text);
      background: #fff;
    }

    .error {
      margin: 6px 0 0;
      color: #a33f28;
      font-size: .86rem;
    }

    .testimonials-container {
      width: min(100%, 560px);
      margin: 10px auto;
      display: grid;
      gap: 14px;
    }

    .testimonial-card {
      overflow: hidden;
      border: 1px solid rgba(7, 94, 84, .12);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .08);
    }

    .testimonial-zoom {
      width: 100%;
      border: 0;
      padding: 0;
      display: block;
      background: transparent;
    }

    .testimonial-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .testimonial-identity {
      padding: 10px 14px 13px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .testimonial-identity strong {
      color: var(--brand);
    }

    .testimonial-identity span {
      color: #68736f;
      font-size: .86rem;
    }

    .testimonial-fallback {
      width: min(100%, 560px);
      margin: 10px auto;
      border-radius: 10px;
      padding: 14px 16px;
      color: #475451;
      background: #fff;
      box-shadow: 0 1px 1px rgba(0, 0, 0, .08);
      font-size: 1rem;
      line-height: 1.38;
    }

    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(0, 0, 0, .72);
    }

    .image-modal.visible {
      display: flex;
    }

    .image-modal img {
      max-width: min(100%, 900px);
      max-height: 88vh;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .28);
    }

    .modal-close {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(7, 94, 84, .95);
      font-size: 1.65rem;
      line-height: 1;
      box-shadow: 0 3px 12px rgba(0, 0, 0, .24);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }

      .checkout-link {
        animation: none !important;
      }

      .option.single {
        animation: none !important;
      }
    }

    @media (max-width: 759px) {
      .app {
        width: min(100%, 430px);
        margin: 0 auto;
        box-shadow: 0 18px 50px rgba(20, 20, 20, .18);
      }

      .header {
        min-height: 56px;
        padding: max(7px, env(safe-area-inset-top)) 9px 7px;
        gap: 8px;
      }

      .identity {
        gap: 8px;
      }

      .back {
        height: 38px;
        font-size: 2.35rem;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .title {
        font-size: 1rem;
      }

      .verified {
        width: 16px;
        height: 16px;
        font-size: .72rem;
      }

      .status {
        font-size: .77rem;
      }

      .chat {
        padding: 18px 16px max(18px, env(safe-area-inset-bottom));
        gap: 8px;
        background-size: 170px 170px;
      }

      .notice {
        margin-bottom: 10px;
        padding: 14px 16px;
      }

      .notice span {
        width: 18px;
        height: 18px;
        flex-basis: 18px;
        font-size: .78rem;
      }

      .notice p {
        font-size: .98rem;
      }

      .row {
        width: 100%;
      }

      .bot-avatar,
      .avatar-spacer {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
      }

      .bubble {
        max-width: min(76%, 310px);
        border-radius: 7px;
        padding: 9px 50px 17px 11px;
        font-size: .98rem;
      }

      .bot .bubble {
        max-width: min(76%, 310px);
      }

      .user .bubble {
        max-width: min(76%, 310px);
      }

      .meta {
        right: 8px;
        bottom: 4px;
        font-size: .66rem;
      }

      .checks {
        font-size: .74rem;
      }

      .typing {
        margin-left: 36px;
      }

      .options {
        width: 100%;
        justify-content: flex-end;
        padding-left: 38px;
      }

      .options.single-options {
        width: 100%;
        padding-right: 0;
      }

      .option {
        font-size: .92rem;
      }

      .option.single {
        flex-basis: 242px;
        min-height: 62px;
        font-size: .96rem;
      }

      .checkout-box {
        width: 100%;
        justify-content: center;
        padding: 18px 0 0;
      }

      .checkout-link {
        width: min(100%, 286px);
        min-height: 56px;
        font-size: 1rem;
      }

      .testimonials-container {
        width: 100%;
        gap: 10px;
      }

      .testimonial-identity {
        padding: 8px 11px 10px;
      }

      .image-modal {
        padding: 12px;
      }
    }
  </style>
</head>

    const STORAGE_KEY = "ruta_alimentaria_21_static_conversation_v9";
    const chat = document.getElementById("chat");
    const progress = document.getElementById("progress");
    const backBtn = document.getElementById("backBtn");
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = "<span></span><span></span><span></span>";

    let state = loadState() || newState();

    function newState() {
      return {
        nodeId: "start",
        profile: {
          language: "es",
          intentScore: 0,
          tags: []
        },
        messages: [],
        history: [],
        phone: "",
        noticeShown: false,
        testimonialsViewed: false,
        sessionId: window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : String(Date.now())
      };
    }

    function nowTime() {
      return new Intl.DateTimeFormat("es", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, savedAt: Date.now() }));
    }

    function trackEvent(eventName, payload = {}) {
      const safePayload = {
        testimonialId: payload.testimonialId,
        nodeId: payload.nodeId || state.nodeId,
        sessionId: state.sessionId,
        primaryGoal: state.profile.primaryGoal,
        primaryPain: state.profile.primaryPain,
        preferredSupport: state.profile.preferredSupport
      };
      console.debug("[analytics]", eventName, safePayload);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (Date.now() - parsed.savedAt > 7 * 24 * 60 * 60 * 1000) {
          localStorage.removeItem(STORAGE_KEY);
          return null;
        }
        if (typeof parsed.testimonialsViewed !== "boolean") parsed.testimonialsViewed = false;
        if (!parsed.sessionId) parsed.sessionId = window.crypto && window.crypto.randomUUID ? window.crypto.randomUUID() : String(Date.now());
        return parsed;
      } catch {
        return null;
      }
    }

    function interpolate(text) {
      const pain = state.profile.primaryPain ? painCopy[state.profile.primaryPain] : {};
      const time = state.profile.availableTime ? timeCopy[state.profile.availableTime] : {};
      const household = state.profile.householdSize ? householdCopy[state.profile.householdSize] : "";
      const support = state.profile.preferredSupport ? supportCopy[state.profile.preferredSupport] : {};
      return text
        .replaceAll("{{pain.recognition}}", pain.recognition || "[pendiente]")
        .replaceAll("{{pain.desiredOutcome}}", pain.desiredOutcome || "[pendiente]")
        .replaceAll("{{pain.offerBridge}}", pain.offerBridge || "[pendiente]")
        .replaceAll("{{time.intro}}", time.intro || "[pendiente]")
        .replaceAll("{{time.text}}", time.text || "[pendiente]")
        .replaceAll("{{time.natural}}", time.natural || "tu tiempo disponible necesita una solución flexible")
        .replaceAll("{{household.text}}", household || "[pendiente]")
        .replaceAll("{{support.summary}}", support.summary || "comenzar por una estructura clara puede ayudarte a reducir decisiones desde el primer día.")
        .replaceAll("{{support.offerIntro}}", support.offerIntro || "Ruta Alimentaria 21 fue organizada para ayudarte a reducir decisiones y aplicar una estructura flexible durante 21 días.")
        .replaceAll("{{offer.formattedPrice}}", offer.formattedPrice)
        .replaceAll("{{offer.refundDays}}", String(offer.refundDays))
        .replaceAll("{{country.name}}", offer.countryName);
    }

    function addNotice() {
      if (state.noticeShown) return;
      const notice = document.createElement("div");
      notice.className = "notice";
      notice.innerHTML = "<span>i</span><p>Esta es una orientación automatizada del equipo y no recibe llamadas.</p>";
      chat.appendChild(notice);
      state.noticeShown = true;
    }

    function addMessage(role, text, showAvatar) {
      const row = document.createElement("div");
      row.className = `row ${role}`;
      if (role === "bot") {
        const avatar = document.createElement("span");
        avatar.className = showAvatar ? "bot-avatar" : "avatar-spacer";
        avatar.setAttribute("aria-hidden", "true");
        row.appendChild(avatar);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.innerHTML = role === "user" ? `${nowTime()} <span class="checks">✓✓</span>` : nowTime();
      bubble.appendChild(meta);
      row.appendChild(bubble);
      if (role === "user") {
        const avatar = document.createElement("span");
        avatar.className = "user-avatar";
        avatar.setAttribute("aria-hidden", "true");
        row.appendChild(avatar);
      }
      chat.appendChild(row);
      state.messages.push({ role, text, showAvatar });
      scrollDown();
    }

    function addTyping() {
      typing.classList.add("visible");
      chat.appendChild(typing);
      scrollDown();
    }

    function removeTyping() {
      typing.classList.remove("visible");
      if (typing.parentNode) typing.parentNode.removeChild(typing);
    }

    function renderHistoryOnly() {
      chat.innerHTML = "";
      state.noticeShown = false;
      addNotice();
      const savedMessages = [...state.messages];
      state.messages = [];
      savedMessages.forEach((message) => addMessage(message.role, message.text, message.showAvatar));
    }

    function validTestimonials() {
      return testimonials.filter((testimonial) => testimonial.active === true && testimonial.consentVerified === true);
    }

    function renderTestimonials(items) {
      document.querySelectorAll(".testimonials-container, .testimonial-fallback").forEach((el) => el.remove());
      state.testimonialsViewed = true;
      trackEvent("testimonial_section_viewed", { nodeId: "testimonial_gallery" });

      if (!items.length) {
        const fallback = document.createElement("div");
        fallback.className = "testimonial-fallback";
        fallback.textContent = "Aún no hemos añadido experiencias verificadas en esta página. Preferimos no publicar comentarios sin poder confirmar su autenticidad.";
        chat.appendChild(fallback);
        scrollDown();
        return;
      }

      const container = document.createElement("div");
      container.className = "testimonials-container";
      items.forEach((testimonial) => {
        const card = document.createElement("article");
        card.className = "testimonial-card";

        const zoom = document.createElement("button");
        zoom.className = "testimonial-zoom";
        zoom.type = "button";
        zoom.setAttribute("aria-label", `Ampliar ${testimonial.alt}`);

        const image = document.createElement("img");
        image.src = testimonial.image;
        image.alt = testimonial.alt;
        image.loading = "lazy";
        image.addEventListener("load", () => {
          trackEvent("testimonial_image_viewed", { testimonialId: testimonial.id, nodeId: "testimonial_gallery" });
        });
        image.addEventListener("error", () => {
          card.remove();
          console.warn(`Depoimento não carregado: ${testimonial.id}`);
        });

        zoom.appendChild(image);
        zoom.addEventListener("click", () => openImageModal(testimonial));

        const identity = document.createElement("div");
        identity.className = "testimonial-identity";
        const name = document.createElement("strong");
        name.textContent = testimonial.name;
        identity.appendChild(name);
        if (testimonial.location) {
          const location = document.createElement("span");
          location.textContent = testimonial.location;
          identity.appendChild(location);
        }

        card.append(zoom, identity);
        container.appendChild(card);
      });

      chat.appendChild(container);
      scrollDown();
    }

    function openImageModal(testimonial) {
      let modal = document.getElementById("imageModal");
      if (!modal) {
        modal = document.createElement("div");
        modal.className = "image-modal";
        modal.id = "imageModal";
        modal.setAttribute("role", "dialog");
        modal.setAttribute("aria-modal", "true");
        modal.innerHTML = '<button class="modal-close" type="button" aria-label="Fechar imagem ampliada">×</button><img alt="">';
        document.body.appendChild(modal);
        modal.addEventListener("click", (event) => {
          if (event.target === modal) closeImageModal();
        });
        modal.querySelector(".modal-close").addEventListener("click", closeImageModal);
      }

      const image = modal.querySelector("img");
      image.src = testimonial.image;
      image.alt = testimonial.alt;
      modal.classList.add("visible");
      document.body.style.overflow = "hidden";
      modal.querySelector(".modal-close").focus();
      trackEvent("testimonial_image_expanded", { testimonialId: testimonial.id, nodeId: "testimonial_gallery" });
    }

    function closeImageModal() {
      const modal = document.getElementById("imageModal");
      if (!modal) return;
      modal.classList.remove("visible");
      document.body.style.overflow = "";
    }

    function renderOptions(node) {
      document.querySelectorAll(".options, .input-block, .checkout-box").forEach((el) => el.remove());
      if (node.checkoutOnly) {
        if (["offer_content", "price"].includes(state.nodeId) && !state.testimonialsViewed) {
          goTo("testimonial_intro");
          return;
        }
        renderCheckoutLink();
        return;
      }
      if (!node.options || !node.options.length) return;
      const options = document.createElement("div");
      options.className = node.singleOption ? "options single-options" : "options";
      node.options.forEach((option) => {
        const button = document.createElement("button");
        button.className = node.singleOption ? "option single" : "option";
        button.type = "button";
        button.textContent = option[0];
        button.addEventListener("click", () => choose(option));
        options.appendChild(button);
      });
      chat.appendChild(options);
      scrollDown();
    }

    function renderCheckoutLink() {
      const box = document.createElement("div");
      box.className = "checkout-box";
      const link = document.createElement("a");
      link.className = "checkout-link";
      link.href = offer.checkoutUrl || "#checkout-pendente";
      link.textContent = "Entendido, me comprometo a cambiar mi alimentación y mi vida";
      link.addEventListener("click", (event) => {
        if (!offer.checkoutUrl) {
          event.preventDefault();
          alert("El enlace de checkout todavía no está configurado. Cuando lo tengas, reemplaza offer.checkoutUrl dentro del index.html.");
        }
      });
      box.appendChild(link);
      chat.appendChild(box);
      scrollDown();
    }

    function openUrl(url) {
      if (!url) return false;
      try {
        const parsed = new URL(url);
        if (!["http:", "https:"].includes(parsed.protocol)) return false;
        window.open(url, "_blank", "noopener,noreferrer");
        return true;
      } catch {
        return false;
      }
    }

    function choose(option) {
      const [label, nextNodeId, updates, action] = option;
      document.querySelectorAll(".options, .input-block, .checkout-box").forEach((el) => el.remove());
      state.history.push(JSON.parse(JSON.stringify({
        nodeId: state.nodeId,
        profile: state.profile,
        messages: state.messages,
        phone: state.phone
      })));
      addMessage("user", label, false);
      state.profile = { ...state.profile, ...(updates || {}) };
      saveState();

      if (action === "restart") {
        restart();
        return;
      }
      if (action === "checkout" && openUrl(offer.checkoutUrl)) return;
      if (action === "privacy" && openUrl(offer.privacyUrl)) return;
      if (state.nodeId === "testimonial_gallery") {
        trackEvent("testimonial_next_clicked", { nodeId: state.nodeId });
      }
      goTo(resolveCommercialDestination(nextNodeId));
    }

    function resolveCommercialDestination(nextNodeId) {
      const commercialNodes = new Set(["offer_content", "price"]);
      if (!commercialNodes.has(nextNodeId)) return nextNodeId;
      if (state.nodeId === "testimonial_conclusion") {
        trackEvent("testimonial_offer_reached", { nodeId: nextNodeId });
        return nextNodeId;
      }
      return "testimonial_intro";
    }

    function goTo(nodeId) {
      state.nodeId = nodeId;
      saveState();
      const node = flow[nodeId];
      progress.style.width = `${node.progress}%`;
      backBtn.disabled = state.history.length === 0;
      addTyping();
      const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 560;
      setTimeout(() => {
        removeTyping();
        node.bot.forEach((message, index) => {
          addMessage("bot", interpolate(message), index === 0);
        });
        if (node.testimonialGallery) {
          renderTestimonials(validTestimonials());
          if (validTestimonials().length) {
            addMessage("bot", testimonialTransparency, false);
            addMessage("bot", testimonialDisclaimer, false);
          }
        }
        if (node.autoNext) {
          saveState();
          const autoDelay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 120 : 1050;
          setTimeout(() => goTo(node.autoNext), autoDelay);
          return;
        }
        renderOptions(node);
        saveState();
      }, delay);
    }

    function restart() {
      localStorage.removeItem(STORAGE_KEY);
      state = newState();
      chat.innerHTML = "";
      progress.style.width = "0%";
      start();
    }

    function goBack() {
      const previous = state.history.pop();
      if (!previous) return;
      state.nodeId = previous.nodeId;
      state.profile = previous.profile;
      state.messages = previous.messages;
      state.phone = previous.phone || "";
      if (flow[state.nodeId].testimonialGallery) {
        state.messages = state.messages.filter((message) => ![testimonialTransparency, testimonialDisclaimer].includes(message.text));
      }
      renderHistoryOnly();
      if (flow[state.nodeId].testimonialGallery) {
        renderTestimonials(validTestimonials());
        if (validTestimonials().length) {
          addMessage("bot", testimonialTransparency, false);
          addMessage("bot", testimonialDisclaimer, false);
        }
      }
      if (!flow[state.nodeId].autoNext) {
        renderOptions(flow[state.nodeId]);
      }
      progress.style.width = `${flow[state.nodeId].progress}%`;
      backBtn.disabled = state.history.length === 0;
      saveState();
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeImageModal();
    });

    function scrollDown() {
      chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
    }

    function start() {
      addNotice();
      if (state.messages.length) {
        renderHistoryOnly();
        renderOptions(flow[state.nodeId]);
        progress.style.width = `${flow[state.nodeId].progress}%`;
        backBtn.disabled = state.history.length === 0;
        return;
      }
      goTo("start");
    }

    backBtn.addEventListener("click", goBack);
    start();
  </script>
</body>
</html>
