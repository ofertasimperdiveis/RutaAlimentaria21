<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075e54">
  <title>Ruta Alimentaria 21</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #075e54;
      --brand-dark: #064b43;
      --chat-bg: #e9dfd2;
      --incoming: #ffffff;
      --outgoing: #dcf8c6;
      --option: #45aaa0;
      --checkout: #29a96b;
      --text: #151515;
      --muted: #7e827c;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      color: var(--text);
      background: #cfc4b8;
      font-family: Arial, Helvetica, sans-serif;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    button:disabled {
      cursor: not-allowed;
      opacity: .68;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
      background: var(--chat-bg);
    }

    .header {
      min-height: 80px;
      padding: max(10px, env(safe-area-inset-top)) 24px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: #fff;
      background: var(--brand);
    }

    .identity {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back {
      width: 28px;
      height: 42px;
      border: 0;
      color: #fff;
      background: transparent;
      font-size: 2.8rem;
      line-height: 1;
    }

    .avatar,
    .bot-avatar,
    .user-avatar {
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 34%, #f0d1b7 0 16%, transparent 17%),
        radial-gradient(circle at 50% 76%, #f8f8f8 0 29%, transparent 30%),
        linear-gradient(135deg, #6d8d84, #d7eee7);
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55);
      flex: 0 0 auto;
    }

    .avatar {
      width: 48px;
      height: 48px;
    }

    .user-avatar {
      background:
        radial-gradient(circle at 50% 36%, #eef1f3 0 18%, transparent 19%),
        radial-gradient(circle at 50% 77%, #eef1f3 0 30%, transparent 31%),
        #9aa1a6;
    }

    .title {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 800;
      font-size: 1.45rem;
      line-height: 1.08;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      margin: 3px 0 0;
      color: rgba(255, 255, 255, .9);
      font-size: 1rem;
    }

    .progress-wrap {
      height: 3px;
      background: var(--brand);
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #8ee4d8;
      transition: width .22s ease;
    }

    .chat {
      min-height: 0;
      overflow-y: auto;
      padding: 28px 16px max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      background:
        url("https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png"),
        var(--chat-bg);
      background-size: 412px 749px;
      background-repeat: repeat;
    }

    .notice {
      width: min(100%, 660px);
      margin: 0 auto 38px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 22px 24px;
      border-radius: 9px;
      color: #536b68;
      background: #d9f3ef;
      box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
    }

    .notice span {
      width: 28px;
      height: 28px;
      display: grid;
      flex: 0 0 28px;
      place-items: center;
      border-radius: 50%;
      color: #d9f3ef;
      background: #6f8581;
      font-size: 1rem;
      font-weight: 800;
    }

    .notice p {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.35;
    }

    .row {
      width: min(100%, 990px);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    .row.bot { justify-content: flex-start; }
    .row.user { justify-content: flex-end; }

    .bot-avatar,
    .avatar-spacer,
    .user-avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
    }

    .avatar-spacer { opacity: 0; }

    .bubble {
      position: relative;
      max-width: min(76%, 310px);
      border-radius: 8px;
      padding: 14px 58px 18px 16px;
      font-size: 1.18rem;
      line-height: 1.36;
      letter-spacing: 0;
      box-shadow:
        0 1px 1.5px rgba(0, 0, 0, .16),
        0 1px 0 rgba(255, 255, 255, .42) inset;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      max-width: min(78%, 880px);
    }

    .user .bubble {
      max-width: min(42%, 360px);
    }

    .bot .bubble {
      background: var(--incoming);
      border-top-left-radius: 3px;
    }

    .user .bubble {
      background: var(--outgoing);
      color: #142019;
      border-top-right-radius: 3px;
    }

    .bot .bubble::before,
    .user .bubble::before {
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
      content: "";
    }

    .bot .bubble::before {
      left: -9px;
      border-width: 0 10px 10px 0;
      border-color: transparent var(--incoming) transparent transparent;
    }

    .user .bubble::before {
      right: -9px;
      border-width: 0 0 10px 10px;
      border-color: transparent transparent transparent var(--outgoing);
    }

    .meta {
      position: absolute;
      right: 12px;
      bottom: 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      color: rgba(92, 99, 94, .72);
      font-size: .78rem;
      line-height: 1;
    }

    .checks {
      color: #34b7f1;
      font-size: .92rem;
    }

    .typing {
      width: 58px;
      height: 34px;
      margin-left: calc((100% - min(100%, 990px)) / 2);
      display: none;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      border-radius: 7px;
      background: var(--incoming);
      box-shadow: 0 1px 1px rgba(0, 0, 0, .12);
    }

    .typing.visible { display: flex; }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      animation: pulse .9s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .12s; }
    .typing span:nth-child(3) { animation-delay: .24s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: .35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    .options {
      width: min(100%, 520px);
      margin: 4px auto 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding-left: 0;
      padding-top: 4px;
    }

    .options.single-options {
      width: min(100%, 990px);
      justify-content: flex-end;
      padding-right: 32px;
    }

    .option {
      min-width: min(100%, 134px);
      min-height: 46px;
      flex: 1 1 134px;
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      color: #fff;
      background: var(--option);
      box-shadow:
        0 1px 1.5px rgba(0, 0, 0, .18),
        0 1px 0 rgba(255, 255, 255, .16) inset;
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
    }

    .option.single {
      flex: 0 1 330px;
      min-height: 86px;
      margin-left: auto;
      color: #142019;
      background: var(--outgoing);
      font-size: 1.14rem;
      font-weight: 500;
      text-align: left;
      padding-right: 54px;
      position: relative;
      animation: subtleReplyPulse 2.4s ease-in-out infinite;
    }

    .option.single::after {
      position: absolute;
      right: 13px;
      bottom: 8px;
      color: #34b7f1;
      font-size: .92rem;
      content: "✓✓";
    }

    @keyframes subtleReplyPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 1px 1.5px rgba(0, 0, 0, .18),
          0 1px 0 rgba(255, 255, 255, .16) inset;
      }

      50% {
        transform: scale(1.018);
        box-shadow:
          0 3px 8px rgba(0, 0, 0, .18),
          0 1px 0 rgba(255, 255, 255, .16) inset;
      }
    }

    .checkout-box {
      width: min(100%, 990px);
      margin: 8px auto 0;
      display: flex;
      justify-content: center;
      padding: 22px 0 0;
    }

    .checkout-link {
      width: min(100%, 340px);
      min-height: 66px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      color: #fff;
      background: var(--checkout);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .18);
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      animation: checkoutPulse 1.35s ease-in-out infinite;
    }

    .checkout-link:hover {
      background: #218d5a;
    }

    @keyframes checkoutPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 2px 4px rgba(0, 0, 0, .18), 0 0 0 0 rgba(41, 169, 107, .44);
      }

      50% {
        transform: scale(1.045);
        box-shadow: 0 8px 18px rgba(0, 0, 0, .2), 0 0 0 12px rgba(41, 169, 107, 0);
      }
    }

    .option:focus-visible,
    .back:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(142, 228, 216, .85);
      outline-offset: 2px;
    }

    .input-block {
      width: min(100%, 420px);
      align-self: center;
      margin-top: 4px;
      border-radius: 8px;
      padding: 10px;
      background: rgba(255, 255, 255, .72);
    }

    .input-block label {
      display: block;
      margin-bottom: 6px;
      color: #345c58;
      font-size: .88rem;
      font-weight: 700;
    }

    .input-block input {
      width: 100%;
      min-height: 48px;
      border: 1px solid rgba(69, 170, 160, .38);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text);
      background: #fff;
    }

    .error {
      margin: 6px 0 0;
      color: #a33f28;
      font-size: .86rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }

      .checkout-link {
        animation: none !important;
      }

      .option.single {
        animation: none !important;
      }
    }

    @media (min-width: 760px) {
      .bot-avatar,
      .avatar-spacer {
        display: none;
      }
    }

    @media (max-width: 759px) {
      .app {
        width: min(100%, 430px);
        margin: 0 auto;
        box-shadow: 0 18px 50px rgba(20, 20, 20, .18);
      }

      .header {
        min-height: 56px;
        padding: max(7px, env(safe-area-inset-top)) 9px 7px;
        gap: 8px;
      }

      .identity {
        gap: 8px;
      }

      .back {
        height: 38px;
        font-size: 2.35rem;
      }

      .avatar {
        width: 40px;
        height: 40px;
      }

      .title {
        font-size: 1rem;
      }

      .status {
        font-size: .77rem;
      }

      .chat {
        padding: 18px 16px max(18px, env(safe-area-inset-bottom));
        gap: 8px;
        background-size: 170px 170px;
      }

      .notice {
        margin-bottom: 10px;
        padding: 14px 16px;
      }

      .notice span {
        width: 18px;
        height: 18px;
        flex-basis: 18px;
        font-size: .78rem;
      }

      .notice p {
        font-size: .98rem;
      }

      .row {
        width: 100%;
      }

      .bubble {
        max-width: min(76%, 310px);
        border-radius: 7px;
        padding: 9px 50px 17px 11px;
        font-size: .98rem;
      }

      .bot .bubble {
        max-width: min(76%, 310px);
      }

      .user .bubble {
        max-width: min(76%, 310px);
      }

      .meta {
        right: 8px;
        bottom: 4px;
        font-size: .66rem;
      }

      .checks {
        font-size: .74rem;
      }

      .typing {
        margin-left: 36px;
      }

      .options {
        width: 100%;
        justify-content: flex-end;
        padding-left: 38px;
      }

      .options.single-options {
        width: 100%;
        padding-right: 0;
      }

      .option {
        font-size: .92rem;
      }

      .option.single {
        flex-basis: 242px;
        min-height: 62px;
        font-size: .96rem;
      }

      .checkout-box {
        width: 100%;
        justify-content: center;
        padding: 18px 0 0;
      }

      .checkout-link {
        width: min(100%, 286px);
        min-height: 56px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Conversación Ruta Alimentaria 21">
    <header class="header">
      <div class="identity">
        <button class="back" id="backBtn" type="button" title="Volver" aria-label="Volver">‹</button>
        <div class="avatar" aria-hidden="true"></div>
        <div>
          <p class="title">Ana — Asistente virtual</p>
          <p class="status">orientación automatizada</p>
        </div>
      </div>
    </header>
    <div class="progress-wrap" aria-hidden="true"><div class="progress" id="progress"></div></div>
    <section class="chat" id="chat" aria-live="polite"></section>
  </main>

  <script>
    const offer = {
      brandName: "Ruta Alimentaria 21",
      agentName: "Ana",
      formattedPrice: "$4.99 USD",
      country: "CO",
      countryName: "Colombia",
      checkoutUrl: "",
      privacyUrl: "",
      refundDays: 7
    };

    const painCopy = {
      ideas: {
        recognition: "Tener que decidir cada comida desde cero puede volver la rutina innecesariamente pesada.",
        desiredOutcome: "una estructura sencilla que te diga qué preparar sin empezar de cero",
        offerBridge: "un menú organizado con alternativas para no depender de la improvisación"
      },
      variety: {
        recognition: "Repetir siempre las mismas comidas puede hacer que una rutina útil se vuelva difícil de mantener.",
        desiredOutcome: "más variedad sin aumentar la complejidad",
        offerBridge: "combinaciones y sustituciones que ayudan a variar con ingredientes comunes"
      },
      family: {
        recognition: "Organizar comidas para varias personas exige conciliar tiempo, cantidad y preferencias diferentes.",
        desiredOutcome: "una planificación adaptable para más de una persona",
        offerBridge: "una estructura que permite ajustar cantidades y hacer sustituciones"
      },
      preparation: {
        recognition: "Cuando no hay nada preparado, la opción más rápida suele ganar, aunque no sea la que habías planeado.",
        desiredOutcome: "dejar algunas decisiones resueltas antes de que llegue el momento de comer",
        offerBridge: "listas y preparaciones simples para reducir decisiones de última hora"
      },
      convenience: {
        recognition: "Elegir lo más rápido no siempre es falta de voluntad; muchas veces es falta de una alternativa igualmente práctica.",
        desiredOutcome: "opciones rápidas que ya estén definidas",
        offerBridge: "recetas cortas y alternativas para los días más ocupados"
      },
      consistency: {
        recognition: "Comenzar es más fácil que mantener una rutina cuando el plan exige demasiado todos los días.",
        desiredOutcome: "un sistema suficientemente sencillo para continuar durante la semana",
        offerBridge: "una organización realista con sustituciones para los días que no salen como esperabas"
      },
      cost: {
        recognition: "Una alimentación más organizada no debería depender de productos especiales o difíciles de encontrar.",
        desiredOutcome: "un plan construido con ingredientes comunes",
        offerBridge: "listas de compras y alternativas que priorizan practicidad y costo"
      },
      waste: {
        recognition: "Comprar sin una planificación clara puede generar desperdicio y aumentar el gasto de la semana.",
        desiredOutcome: "comprar con una idea más clara de cómo utilizar cada ingrediente",
        offerBridge: "listas semanales organizadas para aprovechar mejor las compras"
      },
      substitutions: {
        recognition: "Un plan deja de ser util cuando depende de un ingrediente que no encuentras o no quieres comprar.",
        desiredOutcome: "tener alternativas claras para continuar sin abandonar la organización",
        offerBridge: "una tabla de sustituciones para adaptar el plan a tu realidad"
      }
    };

    const timeCopy = {
      "10_15": {
        intro: "Entonces necesitamos priorizar preparaciones realmente cortas, no recetas que solo parecen rápidas.",
        text: "entre 10 y 15 minutos"
      },
      "20_30": {
        intro: "Ese tiempo permite preparar opciones simples con un poco más de variedad, siempre que las decisiones ya estén organizadas.",
        text: "entre 20 y 30 minutos"
      },
      variable: {
        intro: "En ese caso, el plan necesita funcionar tanto en días tranquilos como en días con poco tiempo.",
        text: "variable según el día"
      }
    };

    const householdCopy = {
      one: "solo para ti",
      two: "para dos personas",
      three_or_more: "para tres o más personas"
    };

    const supportCopy = {
      menu: "Como elegiste un menú organizado, la oferta empieza por el plan de 21 días: una secuencia clara para saber qué preparar sin decidir desde cero.",
      shopping_list: "Como elegiste una lista de compras clara, la oferta destaca las listas semanales y la forma de comprar con más intención antes de cocinar.",
      recipes: "Como elegiste recetas y sustituciones, la oferta empieza por las preparaciones rápidas y las alternativas para adaptar cada comida."
    };

    const flow = {
      start: {
        progress: 5,
        bot: [
          "Hola. Soy Ana, la asistente virtual del equipo Ruta Alimentaria 21.",
          "¿Todo bien?",
          "Este cuestionario sirve para entender tu rutina y mostrarte si Ruta Alimentaria 21 puede ayudarte en pocos segundos.",
          "Es rápido."
        ],
        options: [
          ["Quiero comenzar", "goal_start"],
          ["Quiero saber cómo funciona", "intro_how"],
          ["Prefiero conocer qué recibiré", "intro_content"]
        ]
      },
      intro_how: {
        progress: 8,
        bot: [
          "Funciona como una orientación rápida: primero entiendo tu rutina y después te muestro la parte del programa que encaja mejor con lo que necesitas.",
          "No es una consulta médica ni un diagnóstico; es un material educativo para organizar comidas, compras y sustituciones."
        ],
        options: [
          ["Quiero comenzar", "goal_start"],
          ["Ver qué recibiré", "intro_content"],
          ["Quiero saber para quién es", "audience"]
        ]
      },
      intro_content: {
        progress: 8,
        bot: [
          "Ruta Alimentaria 21 reúne un plan de comidas, listas de compras, recetas sencillas, sustituciones y un planificador semanal.",
          "Para mostrarte la oferta correcta, necesito entender primero cuál es tu principal dificultad."
        ],
        options: [
          ["Organizar mis comidas", "goal_organization", { primaryGoal: "organization" }],
          ["Ahorrar tiempo al cocinar", "goal_time", { primaryGoal: "time" }],
          ["Comer mejor sin gastar de más", "goal_budget", { primaryGoal: "budget" }]
        ]
      },
      goal_start: {
        progress: 8,
        bot: [
          "Para adaptar la orientación a tu rutina, dime qué quieres mejorar primero.",
          "Elige una de las opciones abajo:"
        ],
        options: [
          ["Quiero organizar mis comidas", "goal_organization", { primaryGoal: "organization" }],
          ["Quiero ahorrar tiempo al cocinar", "goal_time", { primaryGoal: "time" }],
          ["Quiero comer mejor sin gastar de más", "goal_budget", { primaryGoal: "budget" }]
        ]
      },
      goal_organization: {
        progress: 14,
        bot: [
          "Entiendo. Cuando cada comida exige una nueva decisión, mantener una rutina puede volverse agotador.",
          "¿Qué suele dificultarte más?"
        ],
        options: [
          ["No sé qué preparar", "contextual_recognition", { primaryPain: "ideas" }],
          ["Termino repitiendo siempre lo mismo", "contextual_recognition", { primaryPain: "variety" }],
          ["Cocino para varias personas", "contextual_recognition", { primaryPain: "family" }]
        ]
      },
      goal_time: {
        progress: 14,
        bot: [
          "Entiendo. Cuando el día está lleno, la alimentación termina compitiendo con todo lo demás.",
          "¿Qué suele ocurrir con más frecuencia?"
        ],
        options: [
          ["Llega la hora y no tengo nada preparado", "contextual_recognition", { primaryPain: "preparation" }],
          ["Termino eligiendo lo más rápido", "contextual_recognition", { primaryPain: "convenience" }],
          ["Empiezo bien, pero abandono durante la semana", "contextual_recognition", { primaryPain: "consistency" }]
        ]
      },
      goal_budget: {
        progress: 14,
        bot: [
          "Entiendo. Comer de forma más organizada no debería obligarte a comprar productos especiales.",
          "¿Qué te preocupa más?"
        ],
        options: [
          ["Que los ingredientes sean caros", "contextual_recognition", { primaryPain: "cost" }],
          ["Comprar de más y desperdiciar comida", "contextual_recognition", { primaryPain: "waste" }],
          ["No saber qué usar cuando falta un ingrediente", "contextual_recognition", { primaryPain: "substitutions" }]
        ]
      },
      contextual_recognition: {
        progress: 27,
        bot: [
          "{{pain.recognition}}",
          "Para que la orientación sea realmente práctica, quiero entender un poco mejor tu rutina."
        ],
        options: [
          ["Tengo entre 10 y 15 minutos", "household", { availableTime: "10_15" }],
          ["Normalmente tengo entre 20 y 30 minutos", "household", { availableTime: "20_30" }],
          ["Mi tiempo cambia mucho segun el dia", "household", { availableTime: "variable" }]
        ]
      },
      household: {
        progress: 39,
        bot: ["{{time.intro}}", "¿Para cuántas personas sueles organizar las comidas?"],
        options: [
          ["Solo para mí", "preferred_support", { householdSize: "one" }],
          ["Para dos personas", "preferred_support", { householdSize: "two" }],
          ["Para tres o más personas", "preferred_support", { householdSize: "three_or_more" }]
        ]
      },
      preferred_support: {

      },

      },
      ingredients_detail: {
        progress: 74,
        bot: [
          "El enfoque prioriza ingredientes comunes y decisiones simples.",
          "La idea es usar alimentos fáciles de encontrar y permitir cambios cuando una opción no está disponible en tu zona."
        ],

          ["Quiero ver la oferta", "offer_content"],
          ["Ver el precio", "price"]
        ]
      },
      offer_content: {
        progress: 100,
        checkoutOnly: true,
        bot: [
          "{{support.focus}}",
          "Ruta Alimentaria 21 reune:",
          "Plan de comidas para 21 días.\nListas de compras semanales.\nRecetas sencillas.\nTabla de sustituciones.\nGuía práctica para bebidas y etiquetas.\nPlanificador semanal.",
          "El objetivo es reducir la improvisación y facilitar una rutina que puedas aplicar en la vida real.",
          "Puedes acceder hoy por {{offer.formattedPrice}}."
        ],
        options: [
          ["Ver la oferta completa", "price"],
          ["Revisar sustituciones", "substitutions_detail"],
          ["Leer aviso educativo", "health_notice"]
        ]
      },
      price: {
        progress: 100,
        checkoutOnly: true,
        bot: [
          "Puedes acceder a Ruta Alimentaria 21 por {{offer.formattedPrice}}.",
          "El acceso incluye todos los materiales presentados y se entrega después de la confirmación del pago."
        ],
        options: [
          ["Revisar contenido", "offer_content"],
          ["Ver aviso educativo", "health_notice"],
          ["Empezar de nuevo", "start", {}, "restart"]
        ]
      },
      privacy: {
        progress: 100,
        bot: [
          "Esta página no solicita teléfono, datos médicos ni texto libre.",
          "Cuando el checkout definitivo esté configurado, la política de privacidad debe estar enlazada desde esa página antes de enviar tráfico."
        ],
        options: [
          ["Volver a la oferta", "offer_content"],
          ["Ver el precio", "price"],
          ["Empezar de nuevo", "start", {}, "restart"]
        ]
      }
    };

    const STORAGE_KEY = "ruta_alimentaria_21_static_conversation_v4";
    const chat = document.getElementById("chat");
    const progress = document.getElementById("progress");
    const backBtn = document.getElementById("backBtn");
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.innerHTML = "<span></span><span></span><span></span>";

    let state = loadState() || newState();

    function newState() {
      return {
        nodeId: "start",
        profile: {
          language: "es",
          intentScore: 0,
          tags: []
        },
        messages: [],
        history: [],
        phone: "",
        noticeShown: false
      };
    }

    function nowTime() {
      return new Intl.DateTimeFormat("es", { hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date());
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, savedAt: Date.now() }));
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (Date.now() - parsed.savedAt > 7 * 24 * 60 * 60 * 1000) {
          localStorage.removeItem(STORAGE_KEY);
          return null;
        }
        return parsed;
      } catch {
        return null;
      }
    }

    function interpolate(text) {
      const pain = state.profile.primaryPain ? painCopy[state.profile.primaryPain] : {};
      const time = state.profile.availableTime ? timeCopy[state.profile.availableTime] : {};
      const household = state.profile.householdSize ? householdCopy[state.profile.householdSize] : "";
      return text
        .replaceAll("{{pain.recognition}}", pain.recognition || "[pendiente]")
        .replaceAll("{{pain.desiredOutcome}}", pain.desiredOutcome || "[pendiente]")
        .replaceAll("{{pain.offerBridge}}", pain.offerBridge || "[pendiente]")
        .replaceAll("{{time.intro}}", time.intro || "[pendiente]")
        .replaceAll("{{time.text}}", time.text || "[pendiente]")
        .replaceAll("{{household.text}}", household || "[pendiente]")
        .replaceAll("{{offer.formattedPrice}}", offer.formattedPrice)
        .replaceAll("{{offer.refundDays}}", String(offer.refundDays))
        .replaceAll("{{country.name}}", offer.countryName);
    }

    function addNotice() {
      if (state.noticeShown) return;
      const notice = document.createElement("div");
      notice.className = "notice";
      notice.innerHTML = "<span>i</span><p>Esta es una orientacion automatizada del equipo y no recibe llamadas.</p>";
      chat.appendChild(notice);
      state.noticeShown = true;
    }

    function addMessage(role, text, showAvatar) {
      const row = document.createElement("div");
      row.className = `row ${role}`;
      if (role === "bot") {
        const avatar = document.createElement("span");
        avatar.className = showAvatar ? "bot-avatar" : "avatar-spacer";
        avatar.setAttribute("aria-hidden", "true");
        row.appendChild(avatar);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.innerHTML = role === "user" ? `${nowTime()} <span class="checks">✓✓</span>` : nowTime();
      bubble.appendChild(meta);
      row.appendChild(bubble);
      if (role === "user") {
        const avatar = document.createElement("span");
        avatar.className = "user-avatar";
        avatar.setAttribute("aria-hidden", "true");
        row.appendChild(avatar);
      }
      chat.appendChild(row);
      state.messages.push({ role, text, showAvatar });
      scrollDown();
    }

    function addTyping() {
      typing.classList.add("visible");
      chat.appendChild(typing);
      scrollDown();
    }

    function removeTyping() {
      typing.classList.remove("visible");
      if (typing.parentNode) typing.parentNode.removeChild(typing);
    }

    function renderHistoryOnly() {
      chat.innerHTML = "";
      state.noticeShown = false;
      addNotice();
      const savedMessages = [...state.messages];
      state.messages = [];
      savedMessages.forEach((message) => addMessage(message.role, message.text, message.showAvatar));
    }

    function renderOptions(node) {
      document.querySelectorAll(".options, .input-block, .checkout-box").forEach((el) => el.remove());
      if (node.checkoutOnly) {
        renderCheckoutLink();
        return;
      }
      const options = document.createElement("div");
      options.className = node.singleOption ? "options single-options" : "options";
      node.options.forEach((option) => {
        const button = document.createElement("button");
        button.className = node.singleOption ? "option single" : "option";
        button.type = "button";
        button.textContent = option[0];
        button.addEventListener("click", () => choose(option));
        options.appendChild(button);
      });
      chat.appendChild(options);
      scrollDown();
    }

    function renderCheckoutLink() {
      const box = document.createElement("div");
      box.className = "checkout-box";
      const link = document.createElement("a");
      link.className = "checkout-link";
      link.href = offer.checkoutUrl || "#checkout-pendente";
      link.textContent = "Ver la oferta y comprometerme a una vida mejor";
      link.addEventListener("click", (event) => {
        if (!offer.checkoutUrl) {
          event.preventDefault();
          alert("El enlace de checkout todavia no esta configurado. Cuando lo tengas, reemplaza offer.checkoutUrl dentro del index.html.");
        }
      });
      box.appendChild(link);
      chat.appendChild(box);
      scrollDown();
    }

    function openUrl(url) {
      if (!url) return false;
      try {
        const parsed = new URL(url);
        if (!["http:", "https:"].includes(parsed.protocol)) return false;
        window.open(url, "_blank", "noopener,noreferrer");
        return true;
      } catch {
        return false;
      }
    }

    function choose(option) {
      const [label, nextNodeId, updates, action] = option;
      document.querySelectorAll(".options, .input-block, .checkout-box").forEach((el) => el.remove());
      state.history.push(JSON.parse(JSON.stringify({
        nodeId: state.nodeId,
        profile: state.profile,
        messages: state.messages,
        phone: state.phone
      })));
      addMessage("user", label, false);
      state.profile = { ...state.profile, ...(updates || {}) };
      saveState();

      if (action === "restart") {
        restart();
        return;
      }
      if (action === "checkout" && openUrl(offer.checkoutUrl)) return;
      if (action === "privacy" && openUrl(offer.privacyUrl)) return;
      goTo(nextNodeId);
    }

    function goTo(nodeId) {
      state.nodeId = nodeId;
      saveState();
      const node = flow[nodeId];
      progress.style.width = `${node.progress}%`;
      backBtn.disabled = state.history.length === 0;
      addTyping();
      const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 560;
      setTimeout(() => {
        removeTyping();
        node.bot.forEach((message, index) => {
          addMessage("bot", interpolate(message), index === 0);
        });
        renderOptions(node);
        saveState();
      }, delay);
    }

    function restart() {
      localStorage.removeItem(STORAGE_KEY);
      state = newState();
      chat.innerHTML = "";
      progress.style.width = "0%";
      start();
    }

    function goBack() {
      const previous = state.history.pop();
      if (!previous) return;
      state.nodeId = previous.nodeId;
      state.profile = previous.profile;
      state.messages = previous.messages;
      state.phone = previous.phone || "";
      renderHistoryOnly();
      renderOptions(flow[state.nodeId]);
      progress.style.width = `${flow[state.nodeId].progress}%`;
      backBtn.disabled = state.history.length === 0;
      saveState();
    }

    function scrollDown() {
      chat.scrollTo({ top: chat.scrollHeight, behavior: "smooth" });
    }

    function start() {
      addNotice();
      if (state.messages.length) {
        renderHistoryOnly();
        renderOptions(flow[state.nodeId]);
        progress.style.width = `${flow[state.nodeId].progress}%`;
        backBtn.disabled = state.history.length === 0;
        return;
      }
      goTo("start");
    }

    backBtn.addEventListener("click", goBack);
    start();
  </script>
